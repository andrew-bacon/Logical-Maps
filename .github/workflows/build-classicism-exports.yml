name: Build Classicism exports

on:
  push:
    branches: [forcing-cardinal-ch]
    paths:
      - ".github/workflows/build-classicism-exports.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r logical-maps/requirements.txt
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Validate and build
        working-directory: logical-maps
        env:
          PMAP_JOBS: "2"
        run: |
          python scripts/pmap.py validate classicism
          python scripts/pmap.py build classicism --no-starter
          python scripts/check_public.py

      - name: Commit generated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logical-maps/build/
          if git diff --cached --quiet; then
            echo "Exports already up to date."
          else
            git commit -m "Rebuild Classicism map and downloads"
            git push origin HEAD:forcing-cardinal-ch
          fi
