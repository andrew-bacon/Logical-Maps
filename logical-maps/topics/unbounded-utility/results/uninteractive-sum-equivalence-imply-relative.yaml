notes: |-
  Original work: converse connecting proof. Only instances of the principle with an integrable compared pair and an arbitrary common summand are used, so under Stochastic Equivalence and Rich Outcomes that restricted form, the full principle and Relative Expectation are equivalent given relative-independence-equivalence-imply-uninteractive-sum. The stationary realization can be sharpened to make min(|D|,|Z|) bounded, by pairing large positive values only with small negative ones and conversely; with the bounded-overlap variant of the principle this still gives Step 1, hence every integrable gamble indifferent to its mean, Shift Invariance, Shift Transfer and Relative Expectation for bounded differences, but Step 2 needs the integrable form, and the bounded variant's implication of Relative Expectation is open. Not Lean-checked.
