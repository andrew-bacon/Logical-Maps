notes: |-
  Original work: connecting proof. Stochastic Equivalence enters only through Sure-Thing (two-cell separability); Relative Expectation alone with Mixture Independence already gives invariance under integrable common summands in any coupling, hence Shift Invariance. The premises are close to minimal: finite-shift-total-extension satisfies DTU and Shift Invariance but fails Shift Transfer, which follows from Uninteractive Sum Invariance through the converse result uninteractive-sum-equivalence-imply-relative, so Shift Invariance with Sure-Thing does not suffice; total-exact-ultrafilter has DTU without Shift, so some continuity is needed; the extension of the base area preorder by one Cauchy comparison (write-up, final section) has CDF-Area Extension without Mixture Independence and fails Shift. L¹ Continuity is not needed: lexicographic-folded-extension has Relative Expectation without it. Together with the converse, the principle is equivalent to Relative Expectation under Mixture Independence and Stochastic Equivalence. Not Lean-checked.
