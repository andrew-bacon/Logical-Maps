proof: |-
  Write M for the fair mixture, realized by a coin B independent of the gambles mixed and shared by both sides of a comparison. Step 1 (integrable summand): for integrable Z and any coupling, X ≽ Y iff X+Z ≽ Y+Z. By Mixture Independence X ≽ Y iff M(X,Y+Z) ≽ M(Y,Y+Z); the differences M(X,Y+Z) − M(X+Z,Y) and M(Y,Y+Z) − M(Y+Z,Y) both equal Z(2B−1), integrable with mean E[Z]E[2B−1] = 0, so Relative Expectation makes each pair indifferent; Mixture Independence again gives M(X+Z,Y) ≽ M(Y+Z,Y) iff X+Z ≽ Y+Z. Step 2 (separability): Mixture Independence and Stochastic Equivalence give Sure-Thing (independence-to-sure-thing); if X°, Y° vanish on an event A and Z vanishes off A, the sums agree on A, so X° ≽ Y° iff X°+Z ≽ Y°+Z. Step 3: let $A=\{|Z|>\max(|X|,|Y|)\}$. Then $|X|1_A, |Y|1_A \le \min(|X|,|Z|)$ and $|Z|1_{A^c}\le \min(|X|,|Z|)+\min(|Y|,|Z|)$ are integrable. If P(A) = 1, X − Y is integrable and Relative Expectation decides both comparisons by E[X−Y]. Otherwise put a = E[X1_A], b = E[Y1_A], p = P(A), γ = (b−a)/(1−p), X° = X1_{A^c}, Y° = (Y+γ)1_{A^c}. Relative Expectation gives X ∼ X°+a and Y ∼ Y°+a (the differences X1_A − a and Y1_A − γ1_{A^c} − a are integrable with mean zero), so by Step 1 X ≽ Y iff X° ≽ Y°. Step 1 removes the integrable Z1_{A^c} from the shifted comparison, the same replacements give X+Z ≽ Y+Z iff X°+Z1_A ≽ Y°+Z1_A, and Step 2 closes the loop. Rich Outcomes supplies the auxiliary gambles in the real chart. Full argument in writeups/relative-independence-equivalence-imply-uninteractive-sum.md.
