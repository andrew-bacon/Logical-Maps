proof: For functional U with propositional output, choose a weakly rigid coextension $U^*$ and put $Zy=\forall
  p\, .\,(U^*y)p\to p$. If Uxq, weak persistence makes $(U^*x)q$ necessary, so Zx entails q. Functionality,
  NI and ND make every $U^*$-pair necessarily either have a different first coordinate or have second
  coordinate q. Weak inextensibility combines this into necessary uniqueness at x, which gives q entails Zx.
  Thus Zx=q and Z represents U. The source extends this construction pointwise to every relational relational
  output type.
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: Proposition 2.16, p. 33 and n. 49
notes: >-
  Stated in the source with Rigid Comprehension (Proposition 2.16); its proof uses only the weak
  persistence and the weak inextensibility of the coextension at the evaluation point, so Weak
  Rigid Comprehension suffices (observed by Cian Dorr, 11 October 2026; the Lean proof, which
  used rigidity only through those two facts, was adjusted to match). With the recorded
  plenitude-r-implies-distinctness-necessary-r, Plenitude is at least as strong as ND, and this
  record makes ND with Weak Rigid Comprehension sufficient for it.
