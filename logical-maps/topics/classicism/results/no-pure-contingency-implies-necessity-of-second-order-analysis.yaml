proof: >-
  Fix a type $\sigma$ and a second-order analytical sentence $A$. The sentences
  $\forall\mathfrak R(\operatorname{Real}_\sigma\mathfrak R\to A(\mathfrak R))$ and
  $\forall\mathfrak R(\operatorname{Real}_\sigma\mathfrak R\to\neg A(\mathfrak R))$ are closed sentences of
  the pure language, every notion in them being defined by abstraction, so No Pure Contingency makes
  each necessary if true. One of them is true: if some real number structure at $\sigma$ falsifies $A$,
  then every one does, since any two are isomorphic and isomorphic structures agree on second-order
  analytical sentences (Huntington's theorem and Bacon's Lemma C.3, theorems of the non-modal
  fragment); and if none falsifies $A$, the first holds, vacuously when there is no structure at all.
  So one disjunct of the instance of the Necessity of Second-Order Analysis is true, hence necessary.
notes: >-
  With [[necessity-of-second-order-analysis-implies-necessity-of-analysis]] and
  [[necessity-of-second-order-analysis-implies-non-contingency-of-ch]] this gives the first-order
  schema and the Non-contingency of the Continuum Hypothesis from No Pure Contingency too, as
  [[no-pure-contingency-implies-necessity-of-arithmetic]] gives the Necessity of Arithmetic. The
  Fregean Axiom and Extensionality reach it through No Pure Contingency.
