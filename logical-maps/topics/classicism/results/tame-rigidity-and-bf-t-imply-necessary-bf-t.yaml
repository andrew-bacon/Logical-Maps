proof: >-
  The proof of tame-rigidity-and-barcan-imply-necessary-barcan at type $t$. Apply Tame Rigidity at type
  $t\to t$ to $Y:=\lambda p\, .\,\top$. $\operatorname{Persistent}(Y)$ is a theorem, and
  $\operatorname{WeaklyInextensible}(Y)$ unfolds to $\forall X^{tt}\, .\,(\forall p\, .\,\Box Xp)\to
  \Box\forall p\, .\,Xp$, which is BF (type t), while $\operatorname{Inextensible}(Y)$ is its
  necessitation. So BF (type t) makes $Y$ weakly rigid, Tame Rigidity makes it rigid, and its
  inextensibility is $\Box$BF (type t).
