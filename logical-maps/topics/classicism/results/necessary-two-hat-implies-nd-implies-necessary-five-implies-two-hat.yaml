proof: 'Write $X:=\Box_{\ne}$, which is necessarily N, K and J (Proposition D14 of The Bounds of Possibility,
  Appendix D), and suppose $\hat X=X$, i.e. $\Box\forall p(\hat{\hat\Box}p\leftrightarrow\Box_{\ne}p)$.
  Proposition D11 gives $p\to\hat X\neg X\neg p$, which under the identity is $p\to X\neg X\neg p$: $X$
  is necessarily B. Propositions D3 and D6 then make $X$ necessarily NKJF$_{\langle\rangle}$, so fact
  (A5) gives $\Box\forall p(\Box_5p\to Xp)$, and with the chain $\Box_{\ne}\le\hat{\hat\Box}\le\Box_5$
  all three operators are identical. In particular $\Box_5=\hat{\hat\Box}$.'
notes: 'Collapse propagates upward: once an operator in the hat tower equals its own hat, everything above
  it up to $\Box_5$ is identical. The same argument shows that the boxed principle is equivalent to each
  of: $\Box_{\ne}$ is necessarily B; $\Box_{\ne}$ necessarily satisfies BF at type $t$; $\Box_{\ne}=\Box_5$.'
