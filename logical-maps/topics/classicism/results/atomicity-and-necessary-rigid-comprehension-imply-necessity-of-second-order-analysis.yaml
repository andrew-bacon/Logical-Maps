proof: >-
  Bacon's Theorem C.2. Its argument: the canonical real number structure, built from the finite
  numerical quantifiers (Theorem A.2), rigidified by Rigid Comprehension, is an inflexible real number
  structure, its elements being necessarily distinct relative to the necessity $\Box_N$ that assumes a
  possible natural number structure (Lemma C.4); with the Leibniz Biconditionals and Rigid Comprehension
  it is necessarily complete, hence necessarily a real number structure, and its rigid subproperties form
  a rigid property, by the pullback of possible rigid subproperties through world properties that the
  map records as atomicity-and-rigid-comprehension-imply-rigid-power (Lemmas C.5–C.7); the induction of
  Lemma C.1 extended to second-order sentences then makes every second-order analytical truth of it
  necessary; and any real number structure, at any type, agrees with it on second-order analytical
  sentences (Lemma C.3). Hence, for each such sentence $A$, $\Box_N\forall\mathfrak R(\operatorname{Real}
  \mathfrak R\to A(\mathfrak R))$ or the same with $\neg A$, and $\Box_N$ may be replaced by $\Box$ because
  a real number structure contains a natural number structure, so the matrix is vacuous where none is
  possible. The map's second-order quantifiers range over all relations where Bacon's range over rigid
  properties; under □Rigid Comprehension every relation agrees on the structure's elements with a rigid
  one at every world, and analytical formulas do not distinguish them (Proposition C.3), so the two
  readings of each instance are necessarily equivalent.
notes: >-
  Bacon's Corollary 5.1, the same conclusion from C5 and □Rigid Comprehension, is derivable on the map:
  □Rigid Comprehension gives □Actuality, which with C5 gives Atomicity. The argument proves more than the
  sentence schema, namely Second-Order Analytic Necessitism at the type of the canonical reals; the
  schema is what it yields at every type, through Lemma C.3.
