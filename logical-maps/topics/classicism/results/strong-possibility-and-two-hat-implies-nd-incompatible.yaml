proof: >-
  Let $E_1:=\forall x^e y^e\, .\,x=y$ and $T_2:=\exists x^e y^e\, .\,x\ne y$. As in
  strong-possibility-and-infinity-e-incompatible, $\Diamond_{\ne}E_1\to E_1$ is a theorem of C, and Strong
  Possibility (pure) gives $E_1$. $T_2$ is also consistent with Maximalist Classicism, being true at the
  root of coalesced-maximalist-root, where Maximalism (pure) holds; so Strong Possibility gives
  $\Diamond_{\ne}T_2$. Two-hat necessity implying ND-necessity is, contraposed, $\Diamond_{\ne}p\to
  \hat{\hat\Diamond}p$, so $\hat{\hat\Diamond}T_2$. Unfolding the hat,
  $\hat{\hat\Diamond}p$ is $\forall q\, .\,q\to\Diamond(\Diamond_{\ne}q\land p)$; at the truth $q:=E_1$ this
  gives $\Diamond(\Diamond_{\ne}E_1\land T_2)$. By the necessitated lemma, $\Diamond(E_1\land T_2)$, which
  is $\Diamond\bot$.
