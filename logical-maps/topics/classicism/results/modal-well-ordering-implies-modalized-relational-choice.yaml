proof: >-
  Let $W$ be necessarily a well-order of $\tau$ and $R^{\sigma\tau t}$ necessarily serial. Put
  $S:=\lambda xy\,.\,(Rx)y\land\forall z\,.\,(Rx)z\to(Wy)z$, the $W$-least $R$-value. At every world
  $R$ is serial and $W$ a well-order, so each $x$ has exactly one $S$-value; so $S$ is necessarily
  functional, and $S\le R$.
references: []
notes: >-
  The argument of modal-well-ordering-r-implies-intensional-choice-r with inputs. With the recorded BF
  + Weak Rigid Comprehension + Relational Choice ⇒ Modal Well-Ordering (through Transversal Choice,
  Zorn's Lemma and Well-Ordering), BF + Weak Rigid Comprehension + Relational Choice ⇒ Modalized
  Relational Choice is derived, strengthening
  bf-weak-rigid-comprehension-atomicity-and-relational-choice-imply-intensional-choice and dropping
  its Atomicity.
