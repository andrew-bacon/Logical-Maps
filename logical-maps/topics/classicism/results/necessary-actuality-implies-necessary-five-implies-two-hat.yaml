proof: Proposition D21 of The Bounds of Possibility, Appendix D, proves $\forall p(\Box_5p\leftrightarrow\hat{\hat\Box}p)$
  in HS4R. Its right-to-left direction uses only HS4. Its left-to-right direction uses, through Corollary
  D20 and Proposition D19, only Actuality ($\exists w\,W@w$) at the world of evaluation, and needs it
  at every world accessible from the actual one in order to obtain $\Box$NKJF$_{\langle\rangle}\hat{\hat\Box}$;
  $\Box$Actuality supplies exactly that. Necessitating gives the boxed principle.
notes: 'The boxed form of [[actuality-implies-five-implies-two-hat]].


  Appendix D notes that the proof needs only this consequence of the rigidity axioms (Proposition C7). Corollary
  D23 is the same fact stated as $\hat{\hat{\hat\Box}}\equiv\hat{\hat\Box}$.'
