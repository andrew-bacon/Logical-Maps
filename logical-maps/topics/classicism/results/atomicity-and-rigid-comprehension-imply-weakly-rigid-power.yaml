proof: >-
  See the write-up. For weakly rigid $F$, let $P:=\lambda Y\, .\,\operatorname{WeaklyRigid}(Y)\land Y\le F$.
  Rigid Comprehension makes each weakly rigid $Y$ rigid (coextensive weakly rigid relations are
  identical), so $P$ is weakly persistent. For an atom $W\le P$, a rigid coextension $X$ of
  $\lambda\bar x\, .\,F[\bar x]\land\Box\forall Y\, .\,WY\to Y[\bar x]$ satisfies $PX$ and
  $\Box\forall Y\, .\,WY\to Y=X$; only the weak rigidity of $Y$ at the later world is needed. If
  $\forall Y\, .\,PY\to\Box ZY$ but $P\not\le Z$, an atom below $\lambda Y\, .\,PY\land\neg ZY$ yields a
  contradiction.
