notes: >-
  Maximalism is used at the one sentence $P$, whose consistency is witnessed by a model rather than
  by a principle of the map, as in maximalism-incompatible-with-modalized-relational-choice. Through
  the recorded implications it makes Maximalism in both forms, Possibility+ and Strong Possibility
  incompatible with the Necessity of Second-Order Analysis and with Analytic Necessitism, which
  imply the Necessity of Analysis.
