proof: >-
  Let $T$ be C with Extensionality, Well-Ordering at every type and $I^*_e$, the theory of the
  components of coalesced-two-extensional-arithmetics-root, and let $A$ be the first-order
  analytical sentence saying that some natural number of the structure codes a proof of a
  contradiction from $T$, $\exists n\in N\,.\,\operatorname{Proof}_T(n,\bot)$, written with the
  structure's $N$, $+$ and $\times$. Let $\sigma$ be the type $((et)t)t$ of properties of the
  numbers at $e$, where Dedekind cuts live, and let $P$ be the closed pure sentence
  $\Diamond\exists\mathfrak R\,.\,(\operatorname{Real}_\sigma(\mathfrak R)\land A(\mathfrak
  R))\land\Diamond\exists\mathfrak R\,.\,(\operatorname{Real}_\sigma(\mathfrak R)\land\neg
  A(\mathfrak R))$, the negation of the instance of the Necessity of Analysis at $\sigma$ and $A$.
  $P$ is consistent with C: it is true at the root of coalesced-two-extensional-arithmetics-root,
  whose components $M_1\models\operatorname{Con}(T)$ and $M_2\models\neg\operatorname{Con}(T)$ each
  carry a real number structure of type $\sigma$, the Dedekind cuts over their numbers, in which $A$
  is false and true respectively (the model's argument against the Necessity of Analysis). So
  Maximalism (pure), in its possibility form, gives $\Diamond P$, and by 4, $\Diamond\Diamond$
  implying $\Diamond$, both conjuncts of $P$ hold: the instance of the Necessity of Analysis fails.
  So Maximalism (pure) and the Necessity of Analysis together give $\bot$.
references:
