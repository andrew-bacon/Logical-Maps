proof: >-
  Given a serial $U$, the relation $U':=\lambda xy\,.\,\operatorname{Serial}(U)\to(Ux)y$ is
  necessarily serial: where $U$ is serial it is $U$, and elsewhere it relates everything to
  everything, the output type being inhabited. Modalized Relational Choice gives a necessarily
  functional $S\le U'$; at the evaluation point $U$ is serial, so $S$ is a functional subrelation of
  $U$.
