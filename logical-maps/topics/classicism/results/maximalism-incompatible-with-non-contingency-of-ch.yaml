notes: >-
  Maximalism is used at the one sentence $P$, whose consistency is witnessed by a model, as in
  [[maximalism-incompatible-with-necessity-of-analysis]]. The witnessing model is defined by cases on CH in
  the ambient set theory, so the argument needs only ZFC.
