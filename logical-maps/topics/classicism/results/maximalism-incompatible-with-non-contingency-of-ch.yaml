proof: >-
  Let $P$ be the negation of the instance of Non-contingency of CH at type $t$,
  $\Diamond\neg\forall\mathfrak R\, .\,(\operatorname{Real}_t(\mathfrak R)\to\operatorname{CH}(\mathfrak R))\land
  \Diamond\neg\forall\mathfrak R\, .\,(\operatorname{Real}_t(\mathfrak R)\to\neg\operatorname{CH}(\mathfrak R))$,
  a closed pure sentence. $P$ is consistent with C: it is true at the evaluation point of
  full-boolean-valued-atom-and-atomless, where CH takes opposite values in the two coordinates (the model's
  argument ch-contingent). So C does not prove $P=\bot$, and Maximalism (pure) gives $P\ne\bot$, that is
  $\Diamond P$. By 4, $\Diamond\Diamond$ implies $\Diamond$, so both conjuncts of $P$ hold, and the instance
  of Non-contingency of CH fails.
