proof: >-
  Let $U:=\lambda xy\, .\,(x\ne y\land\Diamond x=y)\lor\forall z\, .\,(z\ne x\to\Box z\ne x)$, of type
  $e\to e\to t$. It is necessarily serial by a theorem of C: if some $y$ is contingently distinct from
  $x$ then $Uxy$, and otherwise $Uxx$ by the second disjunct. Modalized Relational Choice at $\sigma=\tau=e$
  gives $S$ with $\Box(\operatorname{Functional}(S)\land\forall xy\, .\,Sxy\to Uxy)$. Let $P$ be the
  closed pure sentence $\forall x\,\exists y\,(x\ne y\land\Diamond x=y)\land\neg\exists F\,
  (\operatorname{Functional}(F)\land\forall xy\, .\,Fxy\to x\ne y\land\Diamond x=y)$. $P$ is consistent
  with C: it is true at the evaluation point of the model symmetric-class-reflecting-surjections (see its
  write-up). So Maximalism (pure), in its possibility form, gives $\Diamond P$. Inside the possibility,
  the first conjunct of $P$ makes the second disjunct of $U$ false of every individual, so $S$ is a
  functional relation taking each individual to one contingently distinct from it, and instantiating
  the second conjunct of $P$ at $F:=S$ gives a contradiction. So $\Diamond\bot$, which is false.
references:
- paper: bacon-dorr-classicism
