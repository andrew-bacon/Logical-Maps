- Immediate from the definitions; recorded 23 October 2026. The formulation of the continuum hypothesis as
  a second-order analytical sentence follows Neil Barton and Zachary Goodsell, Continuum Contingency,
  draft of 14 October 2026, §5.6, eq. (27), and §5.7.
