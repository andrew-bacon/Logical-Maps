proof: >-
  $\operatorname{CH}(\mathfrak R)$, that every subproperty of $X$ injects into $N$ or is in bijection
  with $X$, is a second-order analytical sentence (Background, Analysis): its quantifiers range over
  elements of $X$, over subproperties of $X$ and over the relations witnessing injections and
  bijections. The Non-contingency of the Continuum Hypothesis at $\sigma$ is the instance of the
  Necessity of Second-Order Analysis at $\sigma$ and that sentence.
