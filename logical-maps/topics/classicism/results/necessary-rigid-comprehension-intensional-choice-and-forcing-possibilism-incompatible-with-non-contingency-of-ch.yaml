notes: >-
  Stated by Bacon as a theorem, with the proof deferred to another venue; his handout of 19 October 2026
  on the lottery-algebra model and the draft Modalized Domains on Possibility Frames do not reproduce it
  (the lottery record notes a transfer argument not given there). The expected proof: Forcing Possibilism
  supplies a proposition whose entailment algebra is a complete Boolean algebra forcing CH, and one
  forcing its negation; under □Rigid Comprehension and Intensional Choice the real number structures at
  the worlds below each are those of the corresponding generic extensions. Recorded as conjectured until
  a proof is supplied; a written proof, or a model of the three premises deciding CH one way necessarily,
  would settle it.
