proof: 'The argument of atomicity-and-bf-imply-strong-leibniz uses BF only at the relational type $\sigma$
  of the worlds, for the property $\lambda Y\, .\,W\le Y\lor W\le\neg Y$: every weak world of type $\sigma$
  is then a strong world, and Atomicity supplies a weak world below each possible $X$.'
