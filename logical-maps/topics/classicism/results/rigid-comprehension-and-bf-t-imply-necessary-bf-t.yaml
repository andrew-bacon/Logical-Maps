proof: >-
  The proof of rigid-comprehension-and-bf-imply-necessary-bf at type $t$. By Rigid Comprehension at
  type $t\to t$, choose a rigid property $F$ of propositions coextensive with $\lambda p\, .\,p=p$.
  Persistence gives $\forall p\, .\,\Box Fp$, and BF (type t) gives $\Box\forall p\, .\,Fp$. The
  inextensibility of $F$ supplies boxed BF (type t) with its quantifiers restricted to $F$, and inside
  the box everything is $F$, so the restrictions can be removed. This is the boxed closed instance of
  BF (type t).
