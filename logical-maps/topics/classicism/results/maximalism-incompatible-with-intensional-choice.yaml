proof: >-
  For an individual $x$ put $F_x:=\lambda y\, .\,(\exists z\, .\,z\ne x)\to y\ne x$, being distinct from
  $x$ if anything is; it is necessarily instantiated, by some individual other than $x$ if there is one
  and by $x$ otherwise. Intensional Choice at type $e$ gives, for every $x$, some $G_x\le F_x$ with
  $\Box\exists!y\, .\,G_xy$. Let $Q$ be the closed pure sentence $\exists x\, .\,\forall z\, .\,z=x\land
  \neg\exists G\, .\,G\le F_x\land\Box\exists!y\, .\,Gy$. $Q$ is consistent with C, being true at the
  evaluation point of symmetry-constrained-full-point-and-three (see its notes), so Maximalism (pure), in
  its possibility form, gives $\Diamond Q$. At a world where $Q$ holds with sole individual $a$, every
  actual $x$ is $a$, instantiating $\forall z\, .\,z=a$ at $x$; and $G_x\le F_x$ and $\Box\exists!y\,
  .\,G_xy$, which are necessary by 4, hold there too, with $F_x=F_a$. So $G_x$ is a counterexample to
  the second conjunct of $Q$, and $\Diamond Q$ is impossible.
