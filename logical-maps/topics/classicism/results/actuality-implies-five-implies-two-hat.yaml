proof: 'Let $a$ witness Actuality at the actual world. Proposition D18 of The Bounds of Possibility, Appendix
  D, holds for $X:=\Box_{\ne}$ with Actuality only at the world of evaluation: $\hat{\hat\Box}p\leftrightarrow\Box(\hat\Diamond
  a\to p)$. Proposition D19, whose steps use $W@a$ only at the world of evaluation and otherwise $\Box$NKJ$\,\Box_{\ne}$
  (Proposition D14), then gives BF at type $t$ for $\hat{\hat\Box}$ at the actual world: $\forall z\,\hat{\hat\Box}(Yz)\to\hat{\hat\Box}\forall
  z\,Yz$. Now relativize as in Proposition D8: let $C$ be the closed sentence saying that $\hat{\hat\Box}$
  is NKJF$_{\langle\rangle}$, true at the actual world, and put $X^\prime:=\lambda p\, .\,C\to\hat{\hat\Box}p$.
  Then $X^\prime$ is coextensive with $\hat{\hat\Box}$, and $\Box$NKJF$_{\langle\rangle}X^\prime$ holds
  because each clause reduces to a theorem about $\hat{\hat\Box}$ (N, K, J) or to $C$ itself. By the definition
  of $\Box_5$, $\Box_5p\to X^\prime p\to\hat{\hat\Box}p$.'
notes: 'The unboxed form of the boxed result from necessary Actuality: Actuality at the actual world alone
  suffices for the material inclusion there.'
