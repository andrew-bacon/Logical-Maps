proof: >-
  The proof of Proposition 2.4 at type $t$. For propositions $p,q$, the classical identity cases, NI and
  ND (type t) give $\Box(p=q)\lor\Box(p\ne q)$. Using 4, strengthen the second disjunct to
  $\Box\Box(p\ne q)$; normal modal reasoning yields $\Box(p=q\lor\Box(p\ne q))$, equivalently
  $\Box(p\ne q\to\Box(p\ne q))$. Generalize over $q$ and apply BF (type t) with
  $X:=\lambda q\, .\,(p\ne q\to\Box(p\ne q))$, then generalize over $p$ and apply it again with
  $X:=\lambda p\, .\,\forall q\, .\,(p\ne q\to\Box(p\ne q))$, both of type $t\to t$. The result is the
  boxed closed instance of ND (type t).
