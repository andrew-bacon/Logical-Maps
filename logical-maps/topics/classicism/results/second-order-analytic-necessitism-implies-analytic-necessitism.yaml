proof: >-
  An instance of Second-Order Analytic Necessitism at $\sigma$ (for any $n$) asserts, under the same
  antecedent, a rigid real number structure $\mathfrak R$ with $\Box\operatorname{Real}_\sigma(\mathfrak R)$
  together with represented powers; dropping the powers gives the instance of Analytic Necessitism at
  $\sigma$.
