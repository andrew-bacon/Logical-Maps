proof: >-
  The argument of tame-rigidity-and-barcan-imply-necessary-barcan, one relational type at a time: for
  relational $\sigma$, BF at $\sigma$ makes $\lambda x^\sigma\, .\,\top$ weakly rigid, Tame Rigidity
