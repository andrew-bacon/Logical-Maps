proof: >-
  See the write-up. ND at $t$ makes a persistent proposition that is false necessarily false, and
  makes weakly rigid relations necessarily separated (their distinct instances are necessarily
  distinct, by weak inextensibility of the product). A persistent, necessarily separated relation with
  an inextensible coextension is identical to it, hence rigid. Inextensible Comprehension at $\tau t$
  gives it at $\tau$ through families of haecceities, so a weakly rigid $F^\tau$ is rigid, and so is the
  property of rigid relations below $F$. Separation of $F$ makes every weakly rigid relation below
  $F$, at any world, rigid there, so that property is the weak power property of $F$.
references: []
notes: >-
  Uses ND at $t$ and Inextensible Comprehension at $\tau t$ for Weakly Rigid Power at $\tau$; the proof
  also gives Tame Rigidity and Rigid Power at $\tau$ from the same premises. With the recorded results,
  Inextensible Comprehension, Rigid Comprehension, Tame Rigidity and Weakly Rigid Power become
  equivalent over ND and Boolean Completeness.
