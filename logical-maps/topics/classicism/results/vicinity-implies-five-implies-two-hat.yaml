notes: 'Conjectured by Cian Dorr, 14 October 2026. Actuality suffices (see the proved result), and so
  does Vicinity with BF at type $t$. Without BF, the two places where the Actuality proof uses the atom
  resist the Vicinity substitution: the characterization $\hat{\hat\Box}p\leftrightarrow\Box(\hat\Diamond
  w\to p)$ needs $\Box(\hat\Diamond w\to\hat\Diamond q)$ for an arbitrary true $q$, which is B for $\Box_{\ne}$
  at $q$; and step 1 of Proposition D19 applies the atom to the truth $\forall z\,\Box(\hat\Diamond w\to
  Yz)$, which is ND-necessary only if $\Box_{\ne}$ already commutes with $\forall z$. A countermodel would
  need Vicinity without Actuality at a world where the two-hat cluster is non-principal; the paired-individuals
  and star-graph models fail Vicinity.'
