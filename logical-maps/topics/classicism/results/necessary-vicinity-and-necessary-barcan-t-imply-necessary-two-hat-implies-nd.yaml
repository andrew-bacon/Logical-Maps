proof: The unboxed result shows that Vicinity and BF at type $t$ give B for $\Box_{\ne}$ at the world
  of evaluation; under the boxed premises this holds at every world, so $\Box_{\ne}$ is necessarily B,
  and then Propositions D3, D6 and D11 of The Bounds of Possibility, Appendix D, with fact (A5), give
  $\Box_{\ne}=\Box_5$ (see the result that collapse propagates upward), in particular the boxed principle.
notes: 'The boxed form of [[vicinity-and-barcan-t-imply-two-hat-implies-nd]].


