proof: >-
  Given $F^{\tau t}$ with $\Box\exists y\,.\,Fy$, the relation $R:=\lambda p\,y\,.\,Fy$ from
  propositions is necessarily serial. Modalized Relational Choice at $t$ and $\tau$ gives a
  necessarily functional $S\le R$. Then $G:=\lambda y\,.\,(S\top)y$ is necessarily uniquely
  instantiated, and $G\le F$. (In the polyadic form, Intensional Choice is the case of no inputs.)
