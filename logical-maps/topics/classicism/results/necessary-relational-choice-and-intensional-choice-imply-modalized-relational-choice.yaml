proof: >-
  Let $R^{\sigma\tau t}$ be necessarily serial and $F:=\lambda
  Z\,.\,\operatorname{Functional}(Z)\land\forall xy\,.\,(Zx)y\to(Rx)y$. By □Relational Choice,
  necessarily some $Z$ has $FZ$. Intensional Choice at $\sigma\tau t$ gives $G\le F$ that is
  necessarily uniquely instantiated. Then $S:=\lambda xy\,.\,\exists Z\,.\,GZ\land(Zx)y$ is
  necessarily functional, since at each world it is coextensive with the unique instance of $G$, a
  functional relation; and $S\le R$, since $G\le F$.
references: []
notes: >-
  With unboxed Relational Choice the argument fails: $F$ is then instantiated only at the evaluation
  point, while Intensional Choice needs it necessarily instantiated. Whether Relational Choice with
  Intensional Choice implies Modalized Relational Choice is open.
