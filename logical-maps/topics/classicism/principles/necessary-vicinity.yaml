id: necessary-vicinity
name: □Vicinity
category: lattice
statement: Necessarily, there is a true proposition that entails the possibility of each true proposition.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Vicinity}$
date: '2026-09-27'
sources:
- Cian Dorr, suggestion of 27 September 2026.
source_names:
- Dorr 27 Sep
notes: Vicinity has no type parameters, so this is the single sentence $\Box\exists p\, .\,p\land\forall
  q\, .\,q\to p\le\Diamond q$.
lean_def: Classicism.P.NecVicinity.schemaIn
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
- date: '2026-10-14'
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  summary: Added the boxed ND-necessity form as a variant, mirroring Vicinity.
variants:
- id: nd-necessity
  name: ND-necessity form
  statement: Every closed instance of the ND-necessity form of Vicinity is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the ND-necessity form of Vicinity}$
  equivalence: The two forms of Vicinity are equivalent in C (see the page of Vicinity); necessitating
    the derivation and applying K carries the equivalence to the boxed forms.
