id: vicinity
name: Vicinity
category: lattice
statement: There is a true proposition that entails the possibility of each true proposition.
formal: $\exists p\, .\,p\land\forall q\, .\,q\to p\le\Diamond q$
date: '2026-09-27'
sources:
- Christopher Sun, 27 September 2026, who recognised the principle's interest by showing that together
  with Weakly Inextensible Comprehension it implies Actuality.
- Cian Dorr, formulation and name, 27 September 2026.
source_names:
- Sun 27 Sep
- Dorr 27 Sep
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, p. 25
  note: Source of Actuality, of which this is the weakening that asks the witness to entail only the possibility
    of each truth.
notes: Weakens Actuality by replacing $p\le q$ with $p\le\Diamond q$. Its interest was recognised by Christopher
  Sun, who showed that it recovers Actuality from Weakly Inextensible Comprehension, so that Actuality
  is equivalent to Vicinity together with Weakly Inextensible Comprehension. ND at type $t$ gives it trivially,
  with $\top$ as witness.
lean_def: Classicism.P.Vicinity.schemaIn
variants:
- id: nd-necessity
  name: ND-necessity form
  statement: There is a truth that entails every ND-necessary truth.
  formal: $\exists p\, .\,p\land\forall q\, .\,\Box_{\ne}q\to p\le q$
  equivalence: 'Right to left: if $\Box_{\ne}q$, there is a true $r$ with $\Box(\Diamond r\to q)$; Vicinity
    gives $p\le\Diamond r$, so $p\le q$. Left to right: for true $q$, $\Diamond q$ is ND-necessary, since
    $q$ itself witnesses $\Box_{\ne}\Diamond q$ ($\Box_{\ne}$ is J, Proposition D14 of The Bounds of Possibility,
    Appendix D); so $p\le\Diamond q$. Thus Vicinity says that the ND-necessary truths have a true lower
    bound, as Actuality says that all truths do. Form suggested by Cian Dorr, 14 October 2026.'
  definitions: where $\Box_{\ne}p:=\exists q\, .\,q\land\Box(\Diamond q\to p)$ and $\Diamond_{\ne}p:=\neg\Box_{\ne}\neg
    p$.
changes:
- date: '2026-10-14'
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  summary: 'Added the ND-necessity form as a variant: there is a truth that entails every ND-necessary
    truth.'
- date: '2026-10-19'
  by: Claude Opus 5.5 (Anthropic)
  summary: 'At Cian Dorr’s request: definitions of the technical terms of its equivalent forms added.'
