id: necessary-modalized-relational-choice-r
name: □Modalized Relational Choice
category: choice
statement: Necessarily, every necessarily serial relation is entailed by a necessarily functional relation.
formal: $\Box\forall R^{\sigma\tau t}\, .\,\Box\operatorname{Serial}(R)\to\exists S^{\sigma\tau t}\, .\,\Box\operatorname{Functional}(S)\land
  S\le R$
definitions: where $\operatorname{Serial}(U):=\forall x^\sigma\, .\,\exists y^\tau\, .\,(Ux)y$; and $\operatorname{Functional}(U):=\forall
  x^\sigma\, .\,\exists y^\tau\, .\,(Ux)y\land\forall z^\tau\, .\,(Ux)z\to y=z$.
date: '2026-10-11'
sources:
- Cian Dorr, suggestion of 11 October 2026.
source_names:
- Dorr 11 Oct
references: []
notes: The necessitated form of [[modalized-relational-choice-r]]. It is equivalent to [[necessary-relational-choice-r]]
  with [[necessary-intensional-choice-r]].
