id: necessary-modalized-relational-choice-r
name: □Modalized Relational Choice
category: choice
statement: Necessarily, every necessarily serial relation is entailed by a necessarily functional relation.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Modalized Relational Choice}$
date: '2026-10-11'
sources:
- Cian Dorr, suggestion of 11 October 2026.
source_names:
- Dorr 11 Oct
references: []
notes: Box each fully closed instance of Modalized Relational Choice. Type quantifiers remain outside the
  box. It is equivalent to □Relational Choice with □Intensional Choice.
lean_def: Classicism.P.NecModalizedRelationalChoice.schemaIn
