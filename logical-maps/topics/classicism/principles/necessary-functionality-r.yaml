id: necessary-functionality-r
name: □Functionality
category: extensionality
statement: "Necessarily, operations with the same value on every argument are identical. The output type is relational."
formal: $\Box\forall X Y^{\sigma\tau}\, .\,(\forall z^\sigma\, .\,Xz=Yz)\to X=Y\qquad(\tau\ne e)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: The necessitated form of [[functionality-r]].
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
- date: '2026-10-19'
  by: Claude Opus 5.5 (Anthropic)
  summary: 'At Cian Dorr’s request: the formal statement now displays the boxed formula (and so do the
    equivalent forms); the notes now name the base principle with a link, without the boilerplate about
    closed instances and the box; the equivalent forms are stated as necessitations of the base forms.'
variants:
- id: polyadic
  lean:
    ref: Classicism.P.NecFunctionality.listSchemaIn
    equivalence_ref: Classicism.Map.necessary_functionality_r.polyadic
    status: verified
  name: Polyadic form
  statement: Necessarily, operations of several arguments with the same value on every tuple of arguments
    are identical.
  formal: $\Box\forall X Y^{\bar\sigma\tau}\, .\,(\forall\bar z^{\bar\sigma}\, .\,X[\bar z]=Y[\bar z])\to
    X=Y\qquad(\tau\ne e)$
  equivalence: Each instance of the polyadic form of Functionality is derivable in C from finitely many
    instances of the original form, and conversely; the derivations are on the page of the unboxed principle.
    Necessitating them and applying K carries the equivalence to the boxed forms.
lean_def: Classicism.P.NecFunctionality.schemaIn
