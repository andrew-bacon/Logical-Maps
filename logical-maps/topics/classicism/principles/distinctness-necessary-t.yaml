id: distinctness-necessary-t
name: ND (type t)
category: coarse
statement: Distinct propositions are necessarily distinct.
formal: $\forall p q\, .\,p\ne q\to\Box(p\ne q)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.2, p. 22.
