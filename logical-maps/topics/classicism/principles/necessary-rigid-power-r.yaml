id: necessary-rigid-power-r
name: □Rigid Power
category: comprehension
statement: Necessarily, if a relation is rigid, so is the property of being a rigid relation that entails
  it.
formal: $\Box\forall F^{\bar\sigma t}\, .\,\operatorname{Rigid}(F)\to\operatorname{Rigid}(\lambda X^{\bar\sigma
  t}\, .\,\operatorname{Rigid}(X)\land X\le F)$
date: '2026-10-03'
sources:
- Cian Dorr, suggestion of 3 October 2026.
source_names:
- Dorr 3 Oct
references: []
notes: The necessitated form of [[rigid-power-r]].
