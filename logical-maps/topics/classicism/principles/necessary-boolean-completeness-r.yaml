  name: Least-upper-bound form
  statement: Necessarily, every property of entities of a relational type has a least upper bound in that
    type.
  formal: $\Box\forall X^{\tau t}\, .\,\exists y^\tau\, .\,\operatorname{LUB}_\tau(y,X)\qquad(\tau\ne
    e)$
  equivalence: Each instance of the least-upper-bound form of Boolean Completeness is derivable in C from
    finitely many instances of the official form, and conversely; the derivation is on the page of Boolean
    Completeness. Necessitating it and applying K carries the equivalence to the boxed forms.
  definitions: 'where $\operatorname{LUB}_\tau(y,X):=\forall z^\tau\, .\,(\forall w^\tau\, .\,Xw\to w\le_\tau
    z)\leftrightarrow y\le_\tau z$: the upper bounds of $X$ are exactly the entities above $y$.'
