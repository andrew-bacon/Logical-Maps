id: necessary-boolean-completeness-r
name: □Boolean Completeness
category: lattice
statement: "Necessarily, every property of entities of a relational type has a greatest lower bound in that type."
formal: $\Box\forall X^{\tau t}\, .\,\exists y^\tau\, .\,\operatorname{GLB}_\tau(y,X)\qquad(\tau\ne e)$
definitions: 'where $\operatorname{GLB}_\tau(y,X):=\forall z^\tau\, .\,(\forall w^\tau\, .\,Xw\to z\le_\tau
  w)\leftrightarrow z\le_\tau y$: the lower bounds of $X$ are exactly the entities below $y$.'
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: The necessitated form of [[boolean-completeness-r]].
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
- date: '2026-10-19'
  by: Claude Opus 5.5 (Anthropic)
  summary: 'At Cian Dorr’s request: the formal statement now displays the boxed formula (and so do the
    equivalent forms); the notes now name the base principle with a link, without the boilerplate about
    closed instances and the box; the equivalent forms are stated as necessitations of the base forms;
    definitions of its technical terms added; definitions of the technical terms of its equivalent forms
    added.'
