  name: Least-upper-bound form
  statement: Every property of propositions has a least upper bound.
  formal: $\forall X^{tt}\, .\,\exists p\, .\,\operatorname{LUB}_t(p,X)$
  equivalence: The argument for the least-upper-bound form of Boolean Completeness, at type $t$.
  definitions: 'where $\operatorname{LUB}_t(p,X):=\forall q\, .\,(\forall r\, .\,Xr\to r\le q)\leftrightarrow
    p\le q$: the upper bounds of $X$ are exactly the propositions entailed by $p$.'
