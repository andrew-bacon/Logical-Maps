id: rigid-lower-nat-e
name: Rigidity of the at-least natural-number carrier
category: mathematical-contingency
statement: The inductively generated property of at-least finite-cardinality quantifiers at type e is
  strongly rigid.
formal: $\operatorname{Rigid}(N)$
definitions: $N=\operatorname{LowerNat}_e$ is the least successor-closed property of the at-least cardinality
  quantifiers generated by zero. Rigid is the strong notion, persistence plus inextensibility, used in
  the checkpoint Lean project.
date: '2026-10-28'
sources:
- Andrew Bacon, CH-contingency Lean formalization (checkpoint 140, 27 October 2026), map bridge prepared
  by OpenAI GPT-6, prompted by Andrew Bacon, 28 October 2026.
source_names:
- Bacon / Codex CH project
references:
- paper: bacon-ch-general-forcing
  role: background
  note: The mathematical forcing argument and finite-instance assumptions; Lean checkpoint 140 provides
    the certified conditional endpoint.
notes: 'This is the undischarged hypothesis rigidN : Rigid (@LowerNat e _) in natural_CH_contingency_closedBounds.
  It must not be identified with injectivity of CardSuc on N, actual infinity of individuals, or merely
  possible infinity of individuals. Rigidity has not been derived from the other assumptions.'
