id: necessary-gallin-extensional-comprehension-r
name: □Gallin Extensional Comprehension
category: comprehension
statement: "Necessarily, every relation is coextensive with one that is persistent and has a persistent pointwise negation."
formal: $\Box\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{Persistent}(Y)\land\operatorname{Persistent}(\neg
  Y)\land(\forall\bar z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow Y[\bar z])$
definitions: where $\operatorname{Persistent}(Y):=Y\le\lambda\bar x\, .\,\Box Y[\bar x]$, that is, $\Box\forall\bar
  x\, .\,Y[\bar x]\to\Box Y[\bar x]$.
date: '2026-09-20'
sources:
- Cian Dorr, suggestion of 20 September 2026.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 37, p. 28 (the unboxed principle).
source_names:
- Dorr 20 Sep
- Classicism
notes: The necessitated form of [[gallin-extensional-comprehension-r]]. Recorded to match the boxed forms
  of the other comprehension principles.
lean_def: Classicism.P.NecGallinExtensionalComprehension.schemaIn
