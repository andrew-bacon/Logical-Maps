id: necessary-distinctness-preserving-collapse
name: □Truth implies ND-necessity
category: necessity-varieties
statement: Necessarily, every truth is ND-necessary. In C this is the identity $\Box_{\ne}=\lambda p\,
  .\,p$.
formal: $\Box\,\forall p\, .\,p\to\Box_{\ne}p$
date: '2026-10-14'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix E, p. 83 (the unboxed principle,
  under its former name Distinctness-preserving collapse).
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: Appendix E, p. 83
  note: Formulation of the unboxed principle; the boxed form was added with the Varieties of necessity
    category.
aliases:
- □Distinctness-preserving collapse
notes: Box the closed sentence Truth implies ND-necessity. Added 14 October 2026 to match the boxed forms
  of the other collapse principles, at the suggestion of Christopher Sun and Cian Dorr. Equivalent to
  the conjunction of □5-necessity implies ND-necessity and □Truth implies 5-necessity.
variants:
- id: dual
  name: Dual form
  statement: Every closed instance of the dual form of Truth implies ND-necessity is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the dual form of Truth implies ND-necessity}$
  equivalence: The dual form is derivable from the official form in C and conversely, as on the page of
    Truth implies ND-necessity; necessitating the derivation and applying K carries the equivalence to
    the boxed forms.
