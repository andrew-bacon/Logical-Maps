id: necessary-atoms-are-strong-worlds-t
name: □Atoms are strong worlds (type t)
category: more-boolean-structure
statement: Necessarily, every atom is a strong world proposition.
formal: $\Box\forall p\, .\,\operatorname{Atom}_t(p)\to\operatorname{SWorld}_t(p)$
definitions: 'where $\operatorname{SAtom}_t(p):=\Diamond p\land\Box(p\to\operatorname{Atom}_t(p))$: a
  self-atom is a possible proposition that necessarily, if true, is an atom; equivalently, in C, one that
  entails that it is the actual world, $\Box(p\to\forall q\, .\,q\to p\le q)$.; where $\operatorname{SWorld}_t(W):=\Diamond_t
  W\land\Box\forall q\, .\,W\le_t q\lor W\le_t\neg_t q$ is a strong world (Background, Strong and weak
  worlds)'
date: '2026-10-25'
sources:
- Cian Dorr, the notion of a self-atom, Self-Atomicity (Self-Atomism) and the four bridge principles,
  25 October 2026.
source_names:
- Dorr 25 Oct
notes: The boxed form of [[atoms-are-strong-worlds-t]], and the type $t$ instance of [[necessary-atoms-are-strong-worlds-r]].
aliases:
- □Atoms are strong atoms (type t)
