id: necessary-tame-rigidity-r
name: □Tame Rigidity
category: comprehension
statement: Necessarily, every weakly rigid relation, including a proposition, is rigid.
formal: $\Box\forall F^{\bar\sigma t}\, .\,\operatorname{WeaklyRigid}(F)\to\operatorname{Rigid}(F)$
