id: necessary-distinctness-necessary-t
name: □ND (type t)
category: coarse
statement: Necessarily, distinct propositions are necessarily distinct.
formal: $\Box\forall p q\, .\,p\ne q\to\Box(p\ne q)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: The necessitated form of [[distinctness-necessary-t]], and the type $t$ instance of [[necessary-distinctness-necessary-r]].
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic), prompted by Zachary Goodsell
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
- date: '2026-10-19'
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  summary: 'At Cian Dorr’s request: the formal statement now displays the boxed formula (and so do the
    equivalent forms); the statement is restated as the necessitation of the base statement; the notes
    now name the base principle with a link, without the boilerplate about closed instances and the box;
    the equivalent forms are stated as necessitations of the base forms; the statement now says what the
    principle says; the notes link to the unrestricted form.'
variants:
- id: dual
  lean:
    ref: Classicism.P.NecNecessityOfDistinctnessTDual.schemaIn
    equivalence_ref: Classicism.Map.necessary_distinctness_necessary_t.dual
    status: verified
  name: Dual form
  statement: Necessarily, propositions that could be identical are identical.
  formal: $\Box\forall p q\, .\,\Diamond(p=q)\to p=q$
  equivalence: Each instance of the dual form of ND (type t) is derivable in C from finitely many instances
    of the official form, and conversely; the derivation is on the page of ND (type t). Necessitating
    it and applying K carries the equivalence to the boxed forms.
