id: well-ordering-r
name: Well-Ordering
category: choice
statement: Every type, including e, is well-ordered by some relation.
formal: $\exists R^{\sigma\sigma t}\, .\,\operatorname{WO}(R)$
definitions: 'where $\operatorname{WO}(R)$ says that $R$ well-orders the type: it is transitive, antisymmetric
  and total (so reflexive), and every instantiated property of type $\sigma t$ has an $R$-least instance.'
date: '2026-10-08'
sources:
- Cian Dorr, suggestion of 8 October 2026.
source_names:
- Dorr 8 Oct
references: []
notes: >-
  WO is defined in Background: $R$ is transitive, antisymmetric and total, and every instantiated
  property has an $R$-minimal instance. The condition is unboxed, so it concerns the evaluation point
  only, and the well-order need not remain one at other worlds, since its field may contract there by
  contingent identities. Modal Well-Ordering asks for a relation that is necessarily a well-order.
  Well-Ordering is equivalent to Transversal Choice and to Zorn's Lemma, by the recorded results, as
  the well-ordering theorem is to the axiom of choice in set theory (Cian Dorr's conjecture of 7 October
  2026). Relational Choice is enough only if it implies Transversal Choice, which is open.
