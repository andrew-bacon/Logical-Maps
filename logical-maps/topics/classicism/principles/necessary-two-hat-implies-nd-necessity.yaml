id: necessary-two-hat-implies-nd-necessity
name: □Two-hat necessity implies ND-necessity
category: necessity-varieties
statement: 'Necessarily, whatever is two-hat necessary is ND-necessary: the distinctness-preserving modality
  agrees with its hat. In C this is the identity $\hat{\hat\Box}=\Box_{\ne}$.'
formal: $\Box\,\forall p\, .\,\hat{\hat\Box}p\to\Box_{\ne}p$
date: '2026-10-14'
sources:
- Cian Dorr, John Hawthorne, and Juhani Yli-Vakkuri, The Bounds of Possibility, Appendix D, pp. 400–409
  (definitions of the hat operation and of the 5-necessity operator; the principles themselves are not
  stated there).
source_names:
- Bounds of Possibility
references:
- paper: bounds-of-possibility
  role: background
  locator: Appendix D, pp. 400–409
notes: Added at the suggestion of Christopher Sun, 14 October 2026. Box the closed sentence; since identity
  of operators in C is necessary coextensiveness, this is the identity $\hat{\hat\Box}=\Box_{\ne}$.
lean_def: Classicism.P.NecTwoHatImpliesNdNecessity.schemaIn
