id: necessity-of-arithmetic
name: Necessity of Arithmetic
category: mathematical-contingency
statement: Every arithmetical sentence is either necessarily true or necessarily false, given that possibly
  zero is not a successor and successor is injective on numbers, where the numbers are the finite
  cardinalities of properties of a type $\sigma$. One sentence for each type $\sigma$ and each arithmetical
  sentence at $\sigma$.
formal: $\Box(I_\sigma\to A)\lor\Box(I_\sigma\to\neg A)\quad(A\text{ an arithmetical sentence at }\sigma)$
date: '2026-09-20'
sources:
- Zachary Goodsell, Arithmetic is Necessary, draft of 5 June 2024, eq. (1), p. 2; Definition 8 and Theorem 9,
  pp. 19–21.
source_names:
- Arithmetic is Necessary
references:
- paper: goodsell-arithmetic-necessary
  role: formulation
  locator: eq. (1), p. 2; Definition 8 and Theorem 9, pp. 19–21
  note: The source's necessity schema, with its parameters $\nu$, $0$ and successor taken to be $(\sigma
    t)t$, $\mathbf{0}_\sigma$ and $\operatorname{Suc}_\sigma$ for every type $\sigma$, so that its natural
    numbers are the finite cardinalities of properties of type $\sigma$.
notes: >-
  See Background for $I_\sigma$ and for arithmetical sentences. The antecedent $I_\sigma$ is needed because
  the axioms of arithmetic are not theorems of C: if there is only one entity of type $\sigma$, the second
  numeral is the empty cardinality, so successor is not injective. In C the first conjunct of $I^*_\sigma$
  is a theorem, so $I_\sigma$ amounts to the possible injectivity of $\operatorname{Suc}_\sigma$ on finite
  cardinalities, which Possibility Maximalism (pure) grants. Where $\sigma$ necessarily has finitely many
  members, $I_\sigma$ is necessarily false and the instances at $\sigma$ are trivial. Each instance is a
  closed pure sentence, so the schema follows from No Pure Contingency; it follows in C from Countable
  Boolean Completeness, at each $\sigma$ from the instances counting at the same $\sigma$, and it is
  incompatible with Possibility Maximalism (pure) by Gödel's first incompleteness theorem.
changes:
- date: '2026-10-16'
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  summary: Made the type whose finite cardinalities are the numbers schematic, as for Countable Boolean
    Completeness; the principle had fixed it at $e$. The old principle is the instance $\sigma=e$ of the
    new one.
- date: '2026-10-23'
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  minor: true
  summary: Moved from the category Possibility and pure schemata to the new category Mathematical
    contingency; the statement is unchanged.
