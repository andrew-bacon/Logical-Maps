id: necessary-plenitude-r
name: □Plenitude
category: choice
statement: "Necessarily, every total single-valued binary relation is represented by an operation. Its output type is relational, as required by the type system."
formal: $\Box\forall U^{\sigma\tau t}\, .\,\operatorname{Functional}(U)\to\exists X^{\sigma\tau}\, .\,\forall
  y\, .\,(Uy)(Xy)\qquad(\tau\ne e)$
definitions: where $\operatorname{Functional}(U):=\forall x^\sigma\, .\,\exists y^\tau\, .\,(Ux)y\land\forall
  z^\tau\, .\,(Ux)z\to y=z$.
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: The necessitated form of [[plenitude-r]].
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic), prompted by Zachary Goodsell
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
- date: '2026-10-19'
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  summary: 'At Cian Dorr’s request: the formal statement now displays the boxed formula (and so do the
    equivalent forms); the notes now name the base principle with a link, without the boilerplate about
    closed instances and the box; the equivalent forms are stated as necessitations of the base forms;
    definitions of its technical terms added.'
variants:
- id: polyadic
  lean:
    ref: Classicism.P.NecPlenitude.listSchemaIn
    equivalence_ref: Classicism.Map.necessary_plenitude_r.polyadic
    status: verified
  name: Polyadic form
  statement: Necessarily, every total single-valued relation from tuples is represented by an operation
    of several arguments.
  formal: $\Box\forall U^{\bar\sigma\tau t}\, .\,\operatorname{Functional}(U)\to\exists X^{\bar\sigma\tau}\,
    .\,\forall\bar y^{\bar\sigma}\, .\,(U[\bar y])(X[\bar y])\qquad(\tau\ne e)$
  equivalence: Each instance of the polyadic form of Plenitude is derivable in C from finitely many instances
    of the original form, and conversely; the derivations are on the page of the unboxed principle. Necessitating
    them and applying K carries the equivalence to the boxed forms.
