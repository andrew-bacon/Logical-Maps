id: necessary-strong-leibniz-r
name: □Strong Leibniz Biconditionals
category: lattice
statement: "Necessarily, at each relational type, every possible entity (one distinct from bottom) is entailed by a strong world: a possible entity that necessarily entails every entity of the type or its negation."
formal: $\Box\forall X^\sigma\, .\,\Diamond_\sigma X\to\exists W^\sigma\, .\,\operatorname{SWorld}_\sigma(W)\land
  W\le_\sigma X\qquad(\sigma\ne e)$
definitions: 'where $\Diamond_\sigma X:=X\ne\bot_\sigma$ and $\operatorname{SWorld}_\sigma(W):=\Diamond_\sigma
  W\land\Box\forall Y^\sigma\, .\,W\le_\sigma Y\lor W\le_\sigma\neg_\sigma Y$: a strong world is a possible
  entity that necessarily entails every entity of its type or its negation.'
date: '2026-09-22'
sources:
- Andrew Bacon, A Philosophical Introduction to Higher-Order Logics, Routledge, 2024, §8.2, pp. 166, 169–170.
source_names:
- Philosophical Introduction to HOL
references:
- paper: bacon-2024-book
  role: formulation
  locator: §8.2, pp. 166, 169–170
notes: The necessitated form of [[strong-leibniz-r]]. The boxed form is the one Theorem 8.2 of the book
  connects with □BF and □Atomicity. Since strong worlds are only required to be possible, not necessarily
  possible, the unboxed form does not yield 5; Exercise 8.13 shows that requiring necessarily weak worlds
  does.
aliases:
- □SL
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
- date: '2026-10-19'
  by: Claude Opus 5.5 (Anthropic)
  summary: 'At Cian Dorr’s request: the formal statement now displays the boxed formula (and so do the
    equivalent forms); the notes now name the base principle with a link, without the boilerplate about
    closed instances and the box; the equivalent forms are stated as necessitations of the base forms;
    definitions of its technical terms added.'
variants:
- id: dual
  lean:
    ref: Classicism.P.NecStrongLeibnizDual.schemaIn
    equivalence_ref: Classicism.Map.necessary_strong_leibniz_r.dual
    status: verified
  name: Dual form
  statement: Necessarily, whatever is entailed by every strong world of its type is the top element of
    that type.
  formal: $\Box\forall X^\sigma\, .\,(\forall W^\sigma\, .\,\operatorname{SWorld}_\sigma(W)\to W\le_\sigma
    X)\to\neg_\sigma X\le_\sigma X\qquad(\sigma\ne e)$
  equivalence: Each instance of the dual form of Strong Leibniz Biconditionals is derivable in C from
    finitely many instances of the official form, and conversely; the derivation is on the page of Strong
    Leibniz Biconditionals. Necessitating it and applying K carries the equivalence to the boxed forms.
lean_def: Classicism.P.NecStrongLeibniz.schemaIn
