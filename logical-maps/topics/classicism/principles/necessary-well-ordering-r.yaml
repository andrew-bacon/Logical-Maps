id: necessary-well-ordering-r
name: □Well-Ordering
category: choice
statement: Necessarily, every type, including e, is well-ordered by some relation.
formal: $\Box\exists R^{\sigma\sigma t}\, .\,\operatorname{WO}(R)$
definitions: 'where $\operatorname{WO}(R)$ says that $R$ well-orders the type: it is transitive, antisymmetric
  and total (so reflexive), and every instantiated property of type $\sigma t$ has an $R$-least instance.'
date: '2026-10-08'
sources:
- Cian Dorr, suggestion of 8 October 2026.
source_names:
- Dorr 8 Oct
references: []
notes: The necessitated form of [[well-ordering-r]]. The well-order may differ from world to world. [[modal-well-ordering-r]],
  which asks for one relation that is necessarily a well-order, implies it.
changes:
