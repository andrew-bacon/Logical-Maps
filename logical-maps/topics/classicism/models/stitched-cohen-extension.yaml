definition: >-
  The stitching construction of Barton and Goodsell (Continuum Contingency, §8), in its simplest case.
  Work in a generic extension $V[G]$ of a ground model $V$ of ZFC by Cohen forcing, which adds a real and
  is weakly homogeneous, hence $V$-decisive (§7.1): a set of ordinals definable in $V[G]$ from parameters
  in $V$ lies in $V$. Let $C_0$ be the canonical extensional model of $V[G]$ (§7.2.5): one object with its
  identity arrow, the natural numbers as individuals, two propositions, and at each relational type every
  function of $V[G]$ between the lower domains, so that its relations of a type are, up to extension, all
  the subsets in $V[G]$ of the tuples of that type. Call an element of $C_0$ definable when it is
  definable in $V[G]$ from parameters in $V$. The root $\hat M$ is built in $V$ (§8.3, Definition 1,
  with the group $W$ trivial): its individuals are the natural numbers; its propositions are the pairs
  $\langle a,b\rangle$ of a truth value $a$ at the root and a truth value $b$ at $C_0$; and an element of
  a relational type at the root is a pair of a function in $V$ on the root domains, which gives its
  extension at the root, and a definable element of $C_0$ of the same type, which gives its extension at
  $C_0$, the two compatible in that the $C_0$-coordinate of the function's value at an argument is the
  definable element applied to the argument's $C_0$-component. Every such pair is in the domain, so a
  root relation may be any set in $V$ of root tuples together with any definable relation of $C_0$. The
  action model $M$ (§8.4) has the two objects $\hat M$ and $C_0$, their identities, and one arrow
  $h\colon\hat M\to C_0$, the identity on the individuals, which sends every other element to its
  $C_0$-component. Truth at the root is the first coordinate, so at the root $\Box p$ holds iff $p$ is
  true at both objects, and $C_0$ sees only itself. The source works in the full simple type hierarchy;
  the restriction of its model to the map's relational types is an action model of the same kind.
  Evaluation point: $\hat M$, at its identity arrow.


  Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each denotes the
  top element of its type.

meets:
  sigma-top: This is the interpretation the definition fixes.
  finitely-many-propositions-everywhere: The root has four propositions and $C_0$ two.
  fewer-propositions-after: The root has four propositions; $C_0$, after which there is only itself, has two.

arguments:

# The source's verdicts first (Lemmas 15–19, Theorems 20–21), then the rest, in the map's terms.

- holds: [necessary-rigid-comprehension-r]
  text: >-
    Lemma 16 of the source, in the map's terms. Write a root relation as the pair of its root extension
    $E$, a set in $V$ of root tuples, and its $C_0$-extension $g$, a definable relation of $C_0$;
    transport along $h$ sends it to $g$, and $h[E]$, the set of $C_0$-components of the members of $E$,
    is definable from the set in $V$ of their names. The relation is persistent iff $h[E]\subseteq g$.
    It is weakly inextensible iff $g\subseteq h[E]$: the root relation with root extension $E$ and
    $C_0$-extension $h[E]$ necessarily holds of every member of $E$, so weak inextensibility gives
    $g\subseteq h[E]$; conversely, a root relation that necessarily holds of each member of $E$ has root
    extension including $E$ and $C_0$-extension including $h[E]$. So a root relation is weakly rigid iff
    $g=h[E]$, and then rigid, since at $C_0$, which sees only itself, every relation is rigid. Hence
    $(E,g)$ is coextensive with the rigid $(E,h[E])$, and Rigid Comprehension holds at the root; at
    $C_0$ it holds trivially.

- holds: [necessary-relational-choice-r]
  text: >-
    Lemma 17 of the source. A serial root relation $U$ has, by choice in $V$, a functional subrelation
    $E_S$ of its root extension; the root relation with root extension $E_S$ and the $C_0$-extension of
    $U$ is in the domain, lies within $U$ at the root and is functional there, which is all the unboxed
    principle asks. At $C_0$, $V[G]$ supplies a functional subrelation of any serial relation, and the
    full domain contains it.

- holds: [axiom-of-infinity-e]
  text: >-
    The individuals are the natural numbers at both objects (Lemma 15 of the source). At the root the
    finite cardinalities of type $(et)t$ are the numerals $\operatorname{Suc}^k\mathbf 0$: the root
    property of cardinalities whose root extension is the set of numerals, with the corresponding
    definable property at $C_0$, holds of $\mathbf 0$ and is closed under successor, so every finite
    cardinality is a numeral; and the $k$-th numeral holds of a root property of individuals iff its root
    extension has exactly $k$ members, which the universal property has not.

- holds: [necessary-atomicity-t]
  text: >-
    Theorem 21 of the source, with the trivial group. The root has four propositions, the pairs of a
    truth value at the root and one at $C_0$, ordered coordinatewise, and $C_0$ has two; both algebras
    are finite, hence atomic.

- fails: [rigid-power-r, rigid-rigidity-r]
  text: >-
    Lemma 19 of the source, with the universal property of individuals in place of the natural numbers.
    Let $F:=\lambda x^e\, .\,\top$; it is rigid, its root extension being $\mathbb N$ and its
    $C_0$-extension $h[\mathbb N]=\mathbb N$. Its power property
    $P:=\lambda X^{et}\, .\,\operatorname{Rigid}(X)\land X\le F$ is $\lambda X\, .\,\operatorname{Rigid}(X)$,
    as $X\le F$ is a theorem. By the criterion in the argument for Rigid Comprehension, the rigid root
    properties of individuals are the pairs $(E,E)$ with $E\subseteq\mathbb N$ in $V$, whose
    $C_0$-components are the reals of $V$, while at $C_0$ every property is rigid, so the $C_0$-extension
    of $P$ is the whole power set of $\mathbb N$ in $V[G]$. The root property of properties with the
    root extension of $P$ and $C_0$-extension $\mathcal P(\mathbb N)^V$, definable from that parameter,
    necessarily holds of every root instance of $P$, but not, at $C_0$, of the Cohen real, which is rigid
    there. So $P$ is not weakly inextensible: Rigid Power fails at type $(et)t$ and, $P$ being rigidity
    itself, Rigid Rigidity fails at type $et$.

- holds: [necessary-barcan-t]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-10-19'
  text: >-
    Both propositions of $C_0$ are transports of root propositions, so a property of propositions at
    the root that necessarily holds of every root proposition holds at $C_0$ of both propositions there;
    at $C_0$, which sees only itself, BF is trivial.

- holds: [necessary-distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-10-19'
  text: >-
    At the root let $q$ be the proposition true at the root alone. $\Diamond q$ is true at the root and
    false at $C_0$, so for any truth $p$, $\Box(\Diamond q\to p)$ holds, and $q$ witnesses $\Box_{\ne}p$.
    At $C_0$, where necessity is truth, $\top$ witnesses $\Box_{\ne}p$ for every truth $p$.

- fails: [barcan-relational]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-10-19'
  text: >-
    By the weak homogeneity of Cohen forcing, a real of $V[G]$ definable there from parameters in $V$
    lies in $V$; so the $C_0$-components of the root properties of individuals are exactly the reals of
    $V$, and the Cohen real $c$ is the component of none. The root property of properties of individuals
    whose root extension is everything and whose $C_0$-extension is $\mathcal P(\mathbb N)^V$
    necessarily holds of every root property of individuals, but $c$ does not fall under it at $C_0$:
    BF fails at type $et$.

- fails: [intensional-choice-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-10-19'
  text: >-
    At type $(et)t$. Let $F$ be the root property of properties of individuals whose root extension is
    a single root property and whose $C_0$-extension is the reals of $V[G]$ not in $V$. It is necessarily
    instantiated. A property $G\le F$ that is necessarily uniquely instantiated would have a one-element
    $C_0$-extension $\{c\}$, definable from parameters in $V$, with $c$ a new real, which the weak
    homogeneity of the forcing forbids.

- fails: [infinity-t]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-10-19'
  text: >-
    The root has four propositions, so the instance of the schema asking for five pairwise distinct
    ones fails.

notes: >-
  Verdicts the engine derives, checked directly. □Well-Ordering: a well-ordering in $V$ of a root
  domain is the root extension of a root relation with any definable $C_0$-extension, the
  well-ordering conditions being unboxed, and at $C_0$ the full domain contains a well-ordering of each
  type. Functionality fails at type $(et)t$: the property of properties of individuals in the argument
  for the failure of BF and the one with $C_0$-extension $\mathcal P(\mathbb N)^{V[G]}$ take the same
  value, the necessary proposition, at every root property of individuals and differ at $C_0$ on the
  Cohen real. ND fails at type $t$: the proposition true at the root alone and the one true nowhere are
  distinct at the root and both become the false proposition at $C_0$; and the pure sentence that ND
  fails at type $t$ is true at the root and false at $C_0$, so No Pure Contingency fails. Atomicity
  fails at type $(et)t$, as atomicity-and-rigid-comprehension-imply-rigid-power requires: the root
  property $Z$ of properties of individuals with empty root extension and $C_0$-extension the reals of
  $V[G]$ not in $V$ is not bottom, and a root property $A$ below it has a definable $C_0$-extension
  $g$ of new reals; were $A$ an atom with $c\in g$, then for each $n$ the root property with
  $C_0$-extension $\{x\in g : x(n)=c(n)\}$, definable from $g$ and the bit $c(n)$, would lie below
  $A$ and not be bottom, hence be $A$, so that $g=\{c\}$ and $c$ would be definable from parameters
  in $V$, hence in $V$. At type $et$, by contrast, every nonbottom property has an atom below it,
  since a nonempty definable set of natural numbers has a definable singleton below it.


  The source's Theorem 20 (first- and second-order continuum contingency with □Rigid Comprehension and
  □Relational Choice) and Theorem 21 (the same with □Atomicity at type $t$), in the simplest instance of
  the construction. In the source's terms the reals, the rigid properties of natural numbers, are
  persistent but not inextensible: new reals appear at $C_0$. The construction presupposes a generic
  filter, so, as always with forcing, what it establishes is consistency relative to ZFC; a countable
  transitive ground model, or Boolean-valued names, turns it into a construction in ZFC. The source
  varies the construction: any $V$-decisive forcing in place of Cohen forcing (Theorem 20 varies the
  continuum hypothesis either way), a finite group $W$ of automorphisms of the root (Theorem 21), the
  canonical coin-toss model in place of the extensional one with $W$ the reals of $V$ (Theorem 22, which
  gives Recombination, not a principle of the map, and refutes Atomicity at type $t$, Corollary 23,
  answering a conjecture of Christopher Sun; on the map □Rigid Comprehension without Atomicity at type
  $t$ is already witnessed by symmetric-collapse-pair), and iterated stitching (§10). Only the simplest
  instance is recorded. It is the first model on the map with Atomicity at type $t$ and □Rigid
  Comprehension in which Rigid Power fails; it separates □Strong Leibniz (type $t$) with □Rigid
  Comprehension from BF at the relational types and from Atomicity at the higher types; and it shows
  that the Atomicity in atomicity-and-rigid-comprehension-imply-rigid-power cannot be weakened to
  type $t$.
