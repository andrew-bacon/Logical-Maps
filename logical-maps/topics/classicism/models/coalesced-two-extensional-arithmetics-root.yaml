id: coalesced-two-extensional-arithmetics-root
name: 'Coalesced sum of two extensional models disagreeing about arithmetic'
certificate:
  source_id: misc
  produced_by: Cian Dorr, 19 October 2026 (the construction), with Claude Opus 5.5 (Anthropic), who wrote
