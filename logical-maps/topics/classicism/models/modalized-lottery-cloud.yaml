notes: There are 2^μ propositions at the root and 2^ℵ₀ rigid properties of individuals up to root identity.
  Choosing μ above any prescribed cardinal gives the unbounded-size assertion of Corollary 6.9. MP uses
  finite or strictly smaller, not the non-strict reading; it is not asserted necessary. This model implements
  the paper’s full modalized-domain semantics. Bacon’s handout of 19 October 2026 presents the same frame,
  proposition algebra and individuals with constant domains, the functions self-related at every point, and
  quantifiers as meets and joins over them; it was recorded until 23 October 2026 as the separate model
  lottery-algebra-actual-point, with the same verdicts, and was folded into this record by Zachary Goodsell’s
  decision. The two are believed elementarily equivalent, since the handout’s domains are the root-existing
  entities of this model, every entity existing at a cloud point is identical there to a root-existing one
  (Lemma 4.3), and both models’ root-existing relations are, up to identity, the pairs of an actual
  extension and an extensional cloud profile, so every formula denotes the same proposition in both (argument
  by Claude Fable 5.1, prompted by Zachary Goodsell, 23 October 2026, not independently checked).
