settings:
  family: Fix a strong limit cardinal μ>ω with cf(μ)=ω. Use one representative of every nontrivial complete
    Boolean algebra of cardinality <μ (Definition 6.4).
arguments:
- text: At the root all relations on the identity classes are realized, so internal complete Boolean algebras
    and relation-based cardinal comparisons are external ones (Lemmas 6.6–6.7). For strong limit μ of
    countable cofinality, |RO(F)|=2^μ=μ^ω. Pierce’s theorem |C|^ω=|C| excludes complete Boolean algebras
    of size in [μ,2^μ). Every algebra that is finite or strictly smaller than the propositions therefore
    has size <μ. It occurs as a lottery factor and is realized below its component proposition; the degenerate
    algebra is realized below bottom. A root relation witnesses the isomorphism.
