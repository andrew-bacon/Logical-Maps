id: full-two-object-chain-free-loop
name: 'Full action model: two-object chain with a free loop at the second object'
certificate:
  source_id: misc
  produced_by: Claude Fable 5.1 (Anthropic), 19 October 2026
  recorded_by: Claude Fable 5.1 (Anthropic), 19 October 2026
  checked_by: []
  date: '2026-10-19'
  lean: stated
sources:
- Original construction of 19 October 2026, to settle the recorded conjecture
  possible-infinity-t-implies-axiom-of-infinity-t; the full action model on the category described, which
  is a model of C by Classicism, §3.5 and Appendix D.
source_names:
- Claude Fable 5.1 19 Oct
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74
  note: Full action models over a category are models of C.
group: full-action-models
settings:
  construction: >-
    Use two objects $W_0$ and $W_1$. The arrows are the identities, one arrow $h\colon W_0\to W_1$, and
    the powers $s^n$ ($n\ge0$) of one endomorphism $s$ of $W_1$, which compose as
    $s^m\circ s^n=s^{m+n}$ and $s^n\circ h=h$, $h$ being the only arrow from $W_0$ to $W_1$; there is no
    arrow from $W_1$ to $W_0$. Evaluate at $W_0$.
  individuals: singleton
  sigma: top
meets:
  sigma-apart: The construction does not mention Σ.
  finitely-many-propositions: The propositions at $W_0$ are the subsets of the two arrows out of it, four in all.
  nonidentity-arrow: The arrow $h$.
  unretracted-arrow: There is no arrow from $W_1$ back to $W_0$.
  nonepic-arrow: The distinct arrows $s^0$ and $s$ out of $W_1$ agree after $h$, both composites being $h$.
  actual-world-isolated: >-
    The actual-world proposition, the singleton of the identity of $W_0$, is in the domain, the model
    being full; the only other world out of $W_0$ is $h$, and every arrow after $h$ is $h$ again, so no
    world outside it sees a world in it.
  trivial-isomorphisms-everywhere: >-
    The only invertible arrows are the identities: $s^m\circ s^n=s^0$ only for $m=n=0$, and $h$ has no
    inverse.
  retracted-arrows-invertible-everywhere: No arrow other than an identity has a retraction, for the same reason.
arguments:
- holds: [possible-infinity-t]
  choice: free
  text: >-
    $W_1$ sees itself through infinitely many arrows, so, the model being full, it has infinitely many
    propositions, and at $W_1$ the Axiom of Infinity at type $t$ holds: the finite cardinalities of
    propositions there are the numerals, the inductive property of being a numeral being in the full
    domain, and the $k$-th numeral says that there are exactly $k$ propositions, which is false for every
    $k$. The arrow $h$ out of $W_0$ reaches $W_1$, so at $W_0$ the Axiom of Infinity at type $t$ is
    possible, although it fails there, $W_0$ having four propositions.
- fails: [pure-b-r]
  choice: free
  text: >-
    The closed pure sentence that there are exactly four propositions is true at $W_0$ and false at
    $W_1$, which sees only itself; so it is not necessarily possible, and B fails for it.
notes: >-
  The two-object chain with an infinite monoid of endomorphisms at the second object. It is recorded to
  refute the conjecture possible-infinity-t-implies-axiom-of-infinity-t: the evaluation object has four
  propositions and sees one with infinitely many. As the conjecture's notes anticipate, BF at type $t$
  and No Pure Contingency both fail; the engine derives both from Possible Infinity (type $t$) and the
  failure of the Axiom of Infinity (type $t$), and they can be seen directly: transport along $h$ sends
  a proposition $p$ at $W_0$ to every arrow out of $W_1$ if $h\in p$ and to none otherwise, so the
  property of propositions whose extension at $h$ is $\{\emptyset,\{s^n:n\ge0\}\}$ and whose
  extension at the identity is everything necessarily holds of every proposition at $W_0$ and fails at
  $W_1$ of $\{s\}$; and the pure sentence that there are exactly four propositions is true at $W_0$
  and false at $W_1$. With one individual the model is finite at $W_0$ in every type, and infinite at
  $W_1$ from type $t$ up.
