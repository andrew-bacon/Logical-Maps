sources:
- Andrew Bacon, Arbitrarily Large Models of Classicism with BoxRigid Comprehension, Intensional Choice and Mathematical Possibilism, handout supplied 19 October 2026, §§2–8.
- OpenAI Codex, prompted by Andrew Bacon, supplementary arguments for Barcan, non-atomicity and Actuality, 19 October 2026, accompanying write-up.
source_names:
- Large models handout
