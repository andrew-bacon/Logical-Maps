id: lottery-algebra-actual-point
name: 'Lottery algebra: isolated actual point'
certificate:
  source_id: misc
  produced_by: Andrew Bacon
  recorded_by: OpenAI Codex, prompted by Andrew Bacon, 19 October 2026
