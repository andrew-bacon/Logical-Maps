definition: |-
  Work in ZFC. Fix a strong limit cardinal μ > ω of countable cofinality. Let (B_i) contain one representative of each nontrivial complete Boolean algebra of cardinality < μ. Put W = {∗} ⊔ ⨆_i (B_i \ {0}). Refinement on each component is its Boolean order, with ∗ isolated for refinement. Accessibility sends ∗ to every point and a cloud point to its refinements. Propositions are regular open downsets A ≅ 2 × ∏_i B_i. Set D^e = ω and D^t = A. At t, a ~_v b iff a and b agree at all accessible points; at e it is literal equality. At function types, f ~_v g iff fx ~_u gy whenever Rvu and x ~_u y; retain functions self-related everywhere. Interpret application and abstraction as evaluation and function formation, connectives by Boolean operations, quantifiers by meets and joins, identity by {v : x ~_v y}, and necessity by universal accessibility. Use only the map's admitted relational types and evaluate at ∗. Any constants of Σ are interpreted as top at their relational types; no signature verdict is asserted here.
arguments:
- holds: [necessary-rigid-comprehension-r]
  text: >-
    Handout §6: for an actual extension S, take the cloud profile χ_S(z) = ⋁_{y∈S} ε(y,z), where ε is cloud identity. Decoupling supplies the relation with actual extension S and this profile. It is rigid at ∗ and coextensive there with the original relation. Every relation is rigid in the cloud, where necessity is transparent. Thus every closed RC instance has value top, as does its box. See the accompanying write-up.
- holds: [necessary-intensional-choice-r]
  choice: uses
  text: >-
    Handout §7: refine the cloud join of the F-witnesses by a maximal antichain and select a witness x_k on each piece b_k. The profile g(y) = ⋁_k (b_k ∧ ε(x_k,y)) is extensional, lies below F, and selects a unique witness locally on each piece. At ∗ choose a singleton actual extension when F is actually instantiated. Decoupling combines these choices; if F is necessarily instantiated, the resulting G is necessarily uniquely instantiated and entails F. In the cloud the same local argument proves IC on the support of its antecedent. IC has value top, so □IC does also.
- holds: [forcing-possibilism]
  text: >-
    Handout §8: |A| = 2^μ and μ^ω = 2^μ. Pierce's theorem says |C|^ω = |C| for every infinite complete Boolean algebra, so no such algebra has cardinality in [μ,2^μ). At ∗ identity is literal and every relation on the type domains is represented by an actual extension. Thus internal complete Boolean algebras and cardinal comparisons are external ones. Every small C has cardinality < μ and is some B_i up to isomorphism; its copy is the interval below W_i, a proper proposition. A one-element algebra is the interval below bottom. The isomorphism is an available actual relation.
- holds: [necessary-barcan-r]
  by: OpenAI Codex, prompted by Andrew Bacon
  date: '2026-10-19'
  text: >-
    Necessity preserves arbitrary meets and quantifiers range over fixed D^σ. Therefore ⟦∀x □Fx⟧ = ⋀_x □Fx = □⋀_x Fx = ⟦□∀x Fx⟧. Every closed BF instance has value top, as does its box.
- fails: [atomicity-r]
  by: OpenAI Codex, prompted by Andrew Bacon
  date: '2026-10-19'
  text: >-
    The lottery contains an atomless complete Boolean algebra, for example the completion of countable Cohen forcing, whose cardinality is at most 2^ω < μ. Its component proposition W_i is nonzero, and the interval below W_i at ∗ is isomorphic to that atomless algebra. Thus no propositional atom lies below W_i. Failure at t refutes the schema.
notes: >-
  The handout supplies the construction and its soundness proof; the supplementary arguments supply additional verdicts. This is a paper-proof contribution, not a Lean certificate or an independently checked translation. MP is recorded only at the actual point and with strict smallness. The handout also argues that MP fails in the cloud. The algebra has atoms as well as atomless components, so failure of Atomicity does not mean Atomlessness. The write-up gives the construction, proof details and source conventions. No claim of structural CH contingency is added: the handout refers to a transfer argument not reproduced there.

