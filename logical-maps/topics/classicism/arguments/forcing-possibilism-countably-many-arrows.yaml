id: forcing-possibilism-countably-many-arrows
requires: [full-action-model, countably-many-arrows]
choice: uses
holds: [forcing-possibilism]
by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
date: '2026-10-23'
text: >-
  The propositions at the evaluation object are the sets of its countably many arrows, so they have
  the cardinality of the continuum, and a complete Boolean algebra that is finite or has strictly
  fewer elements than the propositions is finite, an infinite complete Boolean algebra having an
  infinite antichain and so at least continuum many elements (with choice). A finite Boolean algebra
  with $n$ atoms is isomorphic to the algebra of subsets of any $n$ arrows, the entailment algebra
  below the proposition consisting of those arrows, which is not top, the arrows being infinitely
  many; the one-element algebra is the entailment algebra below $\bot$. The isomorphism is a
  relation present in the full domains. The internal notions agree with the external ones: a
  property of entities carrying the order of a complete Boolean algebra, every subproperty having a
  least upper bound, is one in the metatheory, since every subset is the extension of a subproperty,
  and Dedekind finiteness and the existence of injective relations are read in a full model as in
  the metatheory. So Forcing Possibilism holds.
