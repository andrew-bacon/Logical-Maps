id: arithmetic-necessitism-extensionally-full
requires: [extensionally-full]
choice: free
holds: [arithmetic-necessitism]
by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
date: '2026-10-23'
text: >-
  The numbers at a type $\sigma$ are the instances of $\mathbb N_\sigma$, the least property
  containing $\mathbf 0_\sigma$ and closed under $\operatorname{Suc}_\sigma$ (Background); the
  numerals $\mathbf 0_\sigma$, $\operatorname{Suc}_\sigma\mathbf 0_\sigma,\ldots$ are closed terms,
  so each denotes at every object, and transport along an arrow carries its denotation at the source
  to its denotation at the target. At any object $v$ reachable from the evaluation point,
  extensional fullness gives a property whose extension at $v$ is exactly the numerals there; it
  contains $\mathbf 0_\sigma$ and is closed under successor, so the numbers at $v$ are exactly the
  numerals, every numeral being an instance of every inductive property. Persistence of $\mathbb
  N_\sigma$ and, given $\Box I^*_\sigma$, the necessary distinctness of the numbers are theorems of
  C (the proof of necessary-rigid-comprehension-implies-arithmetic-necessitism). Inextensibility,
  $\Box\forall X\,.\,(\forall n\,.\,\mathbb N_\sigma n\to\Box Xn)\to\mathbb N_\sigma\le X$: at a
  reachable $v$ and for an arrow $j$ from $v$ to $u$, the numbers at $u$ are the numerals there,
  which are the transports along $j$ of the numbers at $v$, so any $X$ that necessarily holds of the
  numbers at $v$ holds at $u$ of the numbers there. So $\mathbb N_\sigma$ is rigid, and Arithmetic
  Necessitism holds at every type. No choice is used.
