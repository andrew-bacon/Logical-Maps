id: two-hat-nd-noninvertible-retraction
requires:
- full-model
- noninvertible-retracted-arrow
fails:
- two-hat-implies-nd-necessity
by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
date: '2026-10-14'
text: 'In a full action model the actual-world proposition $\{1\}$ is in the domain at every object. Taking
  it as the witness, $\Box_{\ne}p$ holds at an identity iff $p$ contains every arrow out of that object
  with a retraction (these are the arrows at which $\Diamond\{1\}$ holds), and $\hat{\hat\Box}p$ iff $p$
  contains every invertible arrow out of it (an arrow lies in $\hat\Diamond\{1\}$ iff some retraction
  of it has a retraction, i.e. iff it is invertible). Full models satisfy necessary Actuality, so $\Box_5=\hat{\hat\Box}$
  by Proposition D21 of The Bounds of Possibility. Let $u$ have a retraction but no inverse. The true
  proposition $\{1\}$ excludes $u$, so it is not ND-necessary, while every invertible arrow is the identity
  or excluded from no such test: $\{1\}$ is two-hat necessary iff no non-identity arrow is invertible,
  and in any case the proposition $\{1\}\cup\{\text{invertible arrows}\}$ is in the domain, true, two-hat
  necessary and not ND-necessary.'
