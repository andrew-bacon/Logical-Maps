id: arithmetic-necessitism-finitely-pinned
requires: [finitely-pinned-domains]
choice: free
holds: [arithmetic-necessitism]
by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
date: '2026-10-23'
text: >-
  As the argument arithmetic-necessitism-extensionally-full, with the property of being a numeral
  supplied by pinning. The intension $Z$ whose value at each arrow $k$ out of the evaluation object
  is the set of numerals $\mathbf 0_\sigma,\operatorname{Suc}_\sigma\mathbf 0_\sigma,\ldots$ at the
  target of $k$ is pinned down by the empty set, its value depending on the arrow only through its
  target, and is symmetric, transport along a permutation of the points carrying numerals to
  numerals, as transport along any arrow does, numerals being closed terms; so it is in the domain,
  and so is its transport $k\cdot Z$ to any reachable object, whose extension there is exactly the
  numerals. Hence at every reachable object the numbers at $\sigma$, the instances of the least
  inductive property, are exactly the numerals, which transport to numerals; persistence and, given
  $\Box I^*_\sigma$, necessary distinctness are theorems of C, and inextensibility follows as in
  that argument. So Arithmetic Necessitism holds at every type. No choice is used.
