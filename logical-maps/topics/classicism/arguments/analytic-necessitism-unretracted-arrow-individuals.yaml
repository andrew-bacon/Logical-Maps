id: analytic-necessitism-unretracted-arrow-individuals
requires: [full-action-model, unretracted-arrow, infinitely-many-individuals]
choice: free
fails: [analytic-necessitism]
by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
date: '2026-10-23'
text: >-
  As in the argument analytic-necessitism-unretracted-arrow, with the individuals supplying the real
  numbers in place of the propositions. Let $k$ be an arrow out of the evaluation object $w$ with no
  retraction; as there, the model being full, no entity of a relational type at $w$ is determined by
  its transport along $k$, so no rigid real number structure of a relational type at $w$ is
  necessarily a real number structure. But there is a real number structure at $w$ of the relational
  type $((et)t)t$: the individuals at $w$ are infinitely many, the sets of sets of individuals are
  Dedekind-infinite (a theorem of ZF for any infinite set), so the entities of type $(et)t$, which
  include one with any given set of properties of individuals as extension at the identity, include
  a copy of the natural numbers, and the entities of type $((et)t)t$ a copy of the sets of natural
  numbers, hence of the reals; the full domains equip that copy, at the identity, with the order,
  sum, product and natural numbers of the reals, and the structure is complete, every subset of its
  carrier being the extension of a subproperty. So the antecedent of Analytic Necessitism holds at
  that type and its consequent fails: Analytic Necessitism fails. No choice is used.
